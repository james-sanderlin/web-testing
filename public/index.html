<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧪 Browser Test Lab</title>
  <script type="module" src="https://unpkg.com/@material/web/all.js?module"></script>
  <!-- Fine Uploader Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/file-uploader/5.16.2/fine-uploader.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f5f5f5;
    }
    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 500;
      color: #333;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .header-title:hover {
      color: #6366f1;
    }
    .nav-heading {
      padding: 0 1.5rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      flex-shrink: 0;
    }
    .main-layout {
      display: flex;
      flex: 1 1 auto;
      height: 100%;
      min-height: 0;
    }
    nav {
      width: 240px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 1rem 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      background: none;
      border: none;
      padding: 0 1rem;
      list-style: none;
      margin: 0;
    }
    #nav-primary {
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    #nav-primary li {
      justify-content: flex-start !important;
      gap: 0.6rem;
    }
    #nav-primary .material-icons {
      font-size: 1.2rem;
      color: #777;
    }
    #nav-primary li.selected .material-icons {
      color: #6366f1;
    }
    .nav-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
    }
    #recent-heading {
      margin-top: 1.25rem;
    }
    .nav-list li {
      cursor: pointer;
      min-width: 120px;
      border-radius: 4px;
      transition: background 0.2s;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      outline: none;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-empty {
      color: #999;
      font-size: 0.85rem !important;
      line-height: 1.4;
      cursor: default !important;
      display: block !important;
    }
    .star-icon {
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      cursor: pointer;
      color: #aaa;
      flex-shrink: 0;
      margin-left: 0.25rem;
    }
    .star-icon.starred {
      opacity: 1;
      color: #f59e0b;
    }
    .nav-list li:hover .star-icon {
      opacity: 1;
    }
    .nav-list li.selected, .nav-list li[aria-selected="true"] {
      background: #e0e7ff;
    }
    .nav-list li:hover:not(.selected):not(.nav-empty) {
      background: #f5f5f5;
    }
    .nav-list li:focus {
      box-shadow: 0 0 0 2px #6366f1;
    }
    .page-star {
      font-family: 'Material Icons';
      font-size: 1.4rem;
      vertical-align: middle;
      margin-left: 0.5rem;
      color: #c4c4c4;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    .page-star:hover {
      color: #f59e0b;
    }
    .page-star.starred {
      color: #f59e0b;
    }
    main#content {
      flex-grow: 1;
      padding: 2rem;
      overflow-y: auto;
      min-width: 0;
    }

    /* Browse page styles */
    .section-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin: 2rem 0 0.75rem;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .page-card {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .page-card:hover {
      border-color: #6366f1;
      box-shadow: 0 1px 4px rgba(99, 102, 241, 0.15);
    }
    .page-card .page-card-body {
      flex: 1 1 auto;
      min-width: 0;
    }
    .page-card .page-card-name {
      font-weight: 500;
      color: #2563eb;
    }
    .page-card .page-card-desc {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.2rem;
      line-height: 1.35;
    }
    .page-card .star-icon {
      opacity: 0.35;
    }
    .page-card:hover .star-icon,
    .page-card .star-icon.starred {
      opacity: 1;
    }
    .cat-tile {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: #333;
      font-size: 1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .cat-tile:hover {
      border-color: #6366f1;
      box-shadow: 0 1px 4px rgba(99, 102, 241, 0.15);
    }
    .cat-tile .material-icons {
      color: #6366f1;
    }
    .cat-tile .cat-tile-count {
      margin-left: auto;
      color: #999;
      font-size: 0.85rem;
    }
    .cat-tile.active {
      background: #e0e7ff;
      border-color: #6366f1;
      color: #3730a3;
    }
    .cat-tile.active .cat-tile-count {
      color: #6366f1;
    }
    #browse-tiles {
      margin: 1.25rem 0 0.5rem;
    }
    #browse-filter {
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      font: inherit;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
    }
    #browse-filter:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px #e0e7ff;
    }
    .empty-note {
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <a class="header-title" id="home-link">🧪 Browser Test Lab</a>
  </header>
  <div class="main-layout">
    <nav>
      <ul id="nav-primary" class="nav-list"></ul>
      <div class="nav-scroll">
        <div class="nav-heading">Favorites</div>
        <ul id="nav-links" class="nav-list"></ul>
        <div class="nav-heading" id="recent-heading" hidden>Recents</div>
        <ul id="nav-recents" class="nav-list"></ul>
      </div>
    </nav>
    <main id="content">Loading....</main>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
