<h2>Download - Multiple at Once</h2>
<p style="color:#666;margin-bottom:1.5rem;">Trigger several file downloads with a single click. Useful for testing multiple-download prompts and download handling in bulk.</p>

<div class="multi-card">
  <label for="multi-count" style="font-weight:600;font-size:0.9rem;color:#555;">Number of files</label>
  <input type="number" id="multi-count" value="5" min="2" max="50"
    style="padding:0.5rem;border:1px solid #ccc;border-radius:4px;font-size:0.95rem;width:100px;" />
  <button id="multi-download-btn" class="download-btn">
    <span class="material-icons">download</span>
    Download All
  </button>
</div>

<p style="color:#666;font-size:0.85rem;margin:1rem 0;">
  <span class="material-icons" style="font-size:1rem;vertical-align:middle;">info</span>
  Chrome will ask once to "Allow multiple downloads" for this site.
</p>

<ul id="multi-results" style="list-style:none;padding:0;margin:0;font-family:monospace;font-size:0.85rem;color:#333;"></ul>
